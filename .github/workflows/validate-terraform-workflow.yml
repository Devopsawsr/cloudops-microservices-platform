name: Validate Terraform GitHub Actions workflow

on:
  pull_request:
    paths:
      - ".github/workflows/eks-lab-terraform.yml"
      - ".github/workflows/validate-terraform-workflow.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/eks-lab-terraform.yml"
      - ".github/workflows/validate-terraform-workflow.yml"

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate Terraform workflow syntax and expressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow with actionlint
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 \
            .github/workflows/eks-lab-terraform.yml \
            .github/workflows/validate-terraform-workflow.yml
