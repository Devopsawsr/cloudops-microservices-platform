name: EKS Lab - Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform operation"
        type: choice
        required: true
        options:
          - plan
          - recover
          - apply
          - destroy
      target_environment:
        description: "Target environment (only dev infrastructure is configured currently)"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - staging
          - production
      confirmation:
        description: "For destroy, type DESTROY"
        type: string
        required: false

# OIDC is granted only to jobs that access AWS.
permissions:
  contents: read

concurrency:
  group: eks-lab-terraform-${{ inputs.target_environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.14.0"

jobs:
  validate:
    name: "01 | Validate Terraform (${{ inputs.target_environment }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      # Checkout must precede shell commands because the default working directory
      # is a path inside the repository and does not exist on a fresh runner.
      - uses: actions/checkout@v4
      - name: Validate environment isolation
        working-directory: .
        env:
          TARGET_ENV: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            dev) test -d infra/terraform/envs/dev ;;
            qa|staging|production)
              echo "::error::Terraform environment '$TARGET_ENV' is not configured. This workflow intentionally blocks it to avoid using Dev state, role and resources. Provision dedicated infrastructure configuration, state key, IAM role and GitHub environment before enabling it."
              exit 1
              ;;
            *) echo "::error::Unsupported environment '$TARGET_ENV'"; exit 1 ;;
          esac
      - name: Require explicit destroy confirmation
        env:
          OPERATION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$OPERATION" == "destroy" && "$CONFIRMATION" != "DESTROY" ]]; then
            echo "::error::Destroy requires confirmation DESTROY"
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Check formatting
        run: terraform fmt -check
      - name: Initialize without AWS backend
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color

  security:
    name: "02 | TFLint and Checkov (${{ inputs.target_environment }})"
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.59.1
      - name: Run TFLint
        env:
          OPERATION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          tflint --init
          if tflint --format compact; then
            echo "TFLint passed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$OPERATION" == plan || "$OPERATION" == recover ]]; then
            echo "::warning::TFLint findings require remediation before Apply/Destroy."
            echo "TFLint reported findings; this Plan/Recover run is audit-only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::TFLint is blocking $OPERATION until issues are fixed."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.4.3
      - name: Run Checkov (audit on Plan, enforce on changes)
        env:
          OPERATION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if checkov --directory . --framework terraform --quiet --compact; then
            echo "Checkov passed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$OPERATION" == plan || "$OPERATION" == recover ]]; then
            echo "::warning::Checkov security findings require remediation before Apply/Destroy."
            echo "Checkov reported findings; this Plan/Recover run is audit-only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Checkov is blocking $OPERATION until issues are fixed or documented, tightly scoped exceptions are reviewed."
            exit 1
          fi

  reconcile:
    name: "03 | Reconcile IAM (${{ inputs.target_environment }})"
    needs: [validate, security]
    if: ${{ inputs.action == 'recover' }}
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize remote Terraform state
        run: |
          terraform init -input=false \
            -backend-config="bucket=reddy-buddu" \
            -backend-config="key=cloudops/eks-lab/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Reconcile only IAM resources with verified ownership tags
        run: bash ../../../../scripts/reconcile-eks-iam.sh

  plan:
    name: "04 | Plan infrastructure (${{ inputs.target_environment }})"
    needs: [validate, security, reconcile]
    # Reconciliation is a separate explicit state-changing recovery operation. It never runs implicitly for Apply.
    if: ${{ !cancelled() && inputs.action != 'destroy' && needs.validate.result == 'success' && needs.security.result == 'success' && (needs.reconcile.result == 'success' || needs.reconcile.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize remote Terraform state
        run: |
          terraform init -input=false \
            -backend-config="bucket=reddy-buddu" \
            -backend-config="key=cloudops/eks-lab/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Generate and review Terraform plan
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan
      # Saved plan can contain sensitive data. Keep short-lived and limit Actions access.
      - name: Pass the exact generated plan to Apply
        if: ${{ inputs.action == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: eks-dev-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/terraform/envs/dev/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: "05 | Auto-apply Dev Terraform"
    needs: plan
    # Dev-only auto-apply; validation, security and saved plan must all pass first.
    if: ${{ inputs.action == 'apply' && inputs.target_environment == 'dev' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize remote Terraform state
        run: |
          terraform init -input=false \
            -backend-config="bucket=reddy-buddu" \
            -backend-config="key=cloudops/eks-lab/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: eks-dev-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/terraform/envs/dev
      - name: Apply exactly the saved plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

  destroy_plan:
    name: "04 | Destroy plan (${{ inputs.target_environment }})"
    needs: [validate, security]
    if: ${{ inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize remote Terraform state
        run: |
          terraform init -input=false \
            -backend-config="bucket=reddy-buddu" \
            -backend-config="key=cloudops/eks-lab/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Generate and review destroy plan
        run: |
          set -euo pipefail
          terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan
      - name: Pass exact destroy plan to Destroy
        uses: actions/upload-artifact@v4
        with:
          name: eks-dev-destroy-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/terraform/envs/dev/tfplan
          retention-days: 1
          if-no-files-found: error

  destroy:
    name: "05 | Destroy Dev Terraform (DESTROY confirmation)"
    needs: destroy_plan
    # Destroy still requires a deliberate manual trigger and exact DESTROY confirmation.
    if: ${{ inputs.action == 'destroy' && inputs.target_environment == 'dev' && inputs.confirmation == 'DESTROY' && needs.destroy_plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize remote Terraform state
        run: |
          terraform init -input=false \
            -backend-config="bucket=reddy-buddu" \
            -backend-config="key=cloudops/eks-lab/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Download saved destroy plan
        uses: actions/download-artifact@v4
        with:
          name: eks-dev-destroy-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/terraform/envs/dev
      - name: Destroy using exactly the saved plan
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

  verify_apply:
    name: "06 | Verify EKS health after Apply"
    needs: apply
    if: ${{ inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    environment: aws-dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize state
        run: |
          terraform init -input=false \
            -backend-config="bucket=reddy-buddu" \
            -backend-config="key=cloudops/eks-lab/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Verify Terraform outputs and running EKS resources
        run: |
          set -euo pipefail
          CLUSTER="$(terraform output -raw cluster_name)"
          NODEGROUP="$(terraform output -raw node_group_name)"
          STATUS="$(aws eks describe-cluster --name "$CLUSTER" --region "$AWS_REGION" --query 'cluster.status' --output text)"
          NG_STATUS="$(aws eks describe-nodegroup --cluster-name "$CLUSTER" --nodegroup-name "$NODEGROUP" --region "$AWS_REGION" --query 'nodegroup.status' --output text)"
          printf "Cluster: %s (%s)\nNodegroup: %s (%s)\n" "$CLUSTER" "$STATUS" "$NODEGROUP" "$NG_STATUS" >> "$GITHUB_STEP_SUMMARY"
          [[ "$STATUS" == ACTIVE && "$NG_STATUS" == ACTIVE ]] || { echo "::error::EKS or its managed node group is not ACTIVE"; exit 1; }

  summary:
    name: "07 | Execution summary (${{ inputs.target_environment }})"
    needs: [validate, security, reconcile, plan, apply, verify_apply, destroy_plan, destroy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report stage results
        env:
          OPERATION: ${{ inputs.action }}
          TARGET_ENV: ${{ inputs.target_environment }}
          VALIDATE: ${{ needs.validate.result }}
          SECURITY: ${{ needs.security.result }}
          VERIFY: ${{ needs.verify_apply.result }}
          RECONCILE: ${{ needs.reconcile.result }}
          PLAN: ${{ needs.plan.result }}
          APPLY: ${{ needs.apply.result }}
          DESTROY_PLAN: ${{ needs.destroy_plan.result }}
          DESTROY: ${{ needs.destroy.result }}
        run: |
          {
            echo "## EKS Lab Terraform: $TARGET_ENV / $OPERATION"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Validation | $VALIDATE |"
            echo "| TFLint / Checkov | $SECURITY |"
            echo "| EKS post-apply verification | $VERIFY |"
            echo "| IAM recovery (recover only) | $RECONCILE |"
            echo "| Change plan | $PLAN |"
            echo "| Apply | $APPLY |"
            echo "| Destroy plan | $DESTROY_PLAN |"
            echo "| Destroy | $DESTROY |"
            echo ""
            echo "If Terraform reported an S3 state-lock error, confirm no run still holds the lock."
            echo "Review lock details before any force-unlock. Never use -lock=false to bypass a live lock."
            echo "Remote state: s3://reddy-buddu/cloudops/eks-lab/dev/terraform.tfstate"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mark failures accurately
        env:
          OPERATION: ${{ inputs.action }}
          VALIDATE: ${{ needs.validate.result }}
          SECURITY: ${{ needs.security.result }}
          VERIFY: ${{ needs.verify_apply.result }}
          RECONCILE: ${{ needs.reconcile.result }}
          PLAN: ${{ needs.plan.result }}
          APPLY: ${{ needs.apply.result }}
          DESTROY_PLAN: ${{ needs.destroy_plan.result }}
          DESTROY: ${{ needs.destroy.result }}
        run: |
          set -euo pipefail
          [[ "$VALIDATE" == success && "$SECURITY" == success ]] || exit 1
          case "$OPERATION" in
            plan) [[ "$PLAN" == success ]] ;;
            recover) [[ "$RECONCILE" == success && "$PLAN" == success ]] ;;
            apply) [[ "$PLAN" == success && "$APPLY" == success && "$VERIFY" == success ]] ;;
            destroy) [[ "$DESTROY_PLAN" == success && "$DESTROY" == success ]] ;;
            *) exit 1 ;;
          esac
