name: EKS Lab - Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform operation"
        type: choice
        required: true
        options:
          - plan
          - recover
          - apply
          - destroy
      confirmation:
        description: "For destroy, type DESTROY"
        type: string
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: eks-lab-terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: aws-dev
    defaults:
      run:
        working-directory: infra/terraform/envs/dev

    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Validate destroy confirmation
        if: ${{ inputs.action == 'destroy' && inputs.confirmation != 'DESTROY' }}
        run: |
          echo "Destroy requires confirmation DESTROY"
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Initialize remote Terraform state
        run: |
          terraform init -input=false \
            -backend-config="bucket=reddy-buddu" \
            -backend-config="key=cloudops/eks-lab/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Format and validate
        run: |
          terraform fmt -check
          terraform validate

      - name: Recover existing POC IAM resources into Terraform state
        if: ${{ inputs.action == 'recover' }}
        run: bash ../../../../scripts/reconcile-eks-iam.sh

      - name: Review plan after recovery
        if: ${{ inputs.action == 'recover' }}
        run: terraform plan -input=false -no-color -lock-timeout=5m

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -input=false -no-color -lock-timeout=5m

      # Recover IAM objects from interrupted applies, only when ownership tags match.
      - name: Reconcile existing POC IAM before apply
        if: ${{ inputs.action == 'apply' }}
        run: bash ../../../../scripts/reconcile-eks-iam.sh

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Explain state-lock failures
        if: ${{ failure() }}
        run: |
          {
            echo "## Terraform failure triage"
            echo ""
            echo "If the run failed with 'Error acquiring the state lock' (S3 412):"
            echo "1. Check that no local Terraform or other GitHub Actions run is still using this same S3 state."
            echo "2. Review the lock's ID, Who, Operation and Created timestamp in the failed logs."
            echo "3. Only after proving the original operation has ended, use terraform force-unlock LOCK_ID from a properly initialized local checkout."
            echo "4. Never use -lock=false or delete the state file to bypass a live lock."
            echo "5. Re-run plan before attempting apply."
            echo ""
            echo "Remote state: s3://reddy-buddu/cloudops/eks-lab/dev/terraform.tfstate"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: |
          terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan
          terraform apply -input=false -auto-approve tfplan
