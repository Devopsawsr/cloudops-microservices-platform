apiVersion: apps/v1
kind: Deployment
metadata:
  name: labs
  labels:
    app.kubernetes.io/name: labs
    app.kubernetes.io/part-of: cloudops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labs
  template:
    metadata:
      labels:
        app: labs
        app.kubernetes.io/name: labs
        app.kubernetes.io/part-of: cloudops
    spec:
      serviceAccountName: cloudops
      containers:
        - name: labs
          image: cloudops/labs:0.1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: cloudops-config
            - secretRef:
                name: cloudops-db
                optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
