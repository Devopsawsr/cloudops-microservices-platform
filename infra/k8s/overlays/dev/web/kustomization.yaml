apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudops-dev
resources:
  - ../../../base/common
  - ../../../base/web
  - ../common

# Publish the real Web image to ECR before applying this overlay.
# This overlay intentionally excludes the gateway and all nine APIs.
images:
  - name: cloudops/web
    newName: REPLACE_ECR/cloudops-web
    newTag: "0.1-dev"
