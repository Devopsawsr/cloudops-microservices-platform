apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev starts with a single Web service. QA/Staging/Production are not deployed here.
namespace: cloudops-dev

resources:
  - namespace.yaml
  - common
  - ../../base/common
  - ../../base/web

# Image tag verified by the successful Web ECR publish workflow run 42081295085.
# Update to a newly scanned immutable tag when promoting a fresh Web release.
images:
  - name: cloudops/web
    newName: 981625497990.dkr.ecr.us-east-1.amazonaws.com/reddy/buddu-ebooks-web
    newTag: web-eff6d8b0d5b7-42081295085-1

replicas:
  - name: web
    count: 1
